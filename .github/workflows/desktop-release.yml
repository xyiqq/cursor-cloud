name: Desktop Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: deepseek-harness-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deepseek-harness-desktop/package-lock.json
      - run: npm ci
      - run: npm run sync:natives
      - run: npm run patch:picker
      - run: npm run verify:runtime
      - run: npx electron-builder --win zip portable --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip','.exe' } | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            deepseek-harness-desktop/dist/*.zip
            deepseek-harness-desktop/dist/*-portable.exe
            deepseek-harness-desktop/dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: false
